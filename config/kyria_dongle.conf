# BLE is also required for the wireless links to the two halves.
CONFIG_ZMK_USB=y
CONFIG_ZMK_BLE=y
CONFIG_ZMK_DISPLAY=n

# Dedicated USB serial stream for the two halves' battery percentages.
CONFIG_ZMK_BATTERY_USB=y

# Keep selections in RAM; boot with USB preferred and Bluetooth profile 0.
# These options are provided by patch/volatile_output_selection.patch.
CONFIG_ZMK_OUTPUT_SELECTION_PERSISTENCE=n
CONFIG_ZMK_BLE_PROFILE_SELECTION_PERSISTENCE=n
