on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m pip install pyyaml
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import yaml
          with open("build.yaml") as source:
              print("matrix=" + json.dumps(yaml.safe_load(source)))
          PY

  build:
    runs-on: ubuntu-latest
    container: zmkfirmware/zmk-build-arm:stable
    needs: matrix
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.matrix.outputs.matrix) }}
    env:
      BOARD: ${{ matrix.board }}
      SHIELD: ${{ matrix.shield }}
      ARTIFACT_NAME: ${{ matrix.artifact-name }}
    steps:
      - uses: actions/checkout@v4
      - name: Initialize ZMK
        run: |
          west init -l config
          west update
          west zephyr-export
      - name: Apply local patches
        run: make patch
      - name: Build firmware
        run: |
          west build -s zmk/app -d build -b "$BOARD" -- \
            -DZMK_CONFIG="$GITHUB_WORKSPACE/config" -DSHIELD="$SHIELD"
      - name: Prepare artifact
        id: artifact
        shell: bash
        run: |
          name="${ARTIFACT_NAME:-${SHIELD}-${BOARD//\//_}-zmk}"
          mkdir -p build/artifacts
          cp build/zephyr/zmk.uf2 "build/artifacts/$name.uf2"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: artifact-${{ steps.artifact.outputs.name }}
          path: build/artifacts/*.uf2
          if-no-files-found: error

  merge:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/upload-artifact/merge@v4
        with:
          name: firmware
          pattern: artifact-*
          delete-merged: true
